name: Generate Server Hostname

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment"
        required: true
        type: choice
        options:
          - nonprod
          - prod

      os:
        description: "Operating System"
        required: true
        type: choice
        options:
          - windows
          - linux

      count:
        description: "Number of hostnames to generate (1-20)"
        required: true
        default: "1"
        type: string

# Prevent parallel runs to avoid counter race conditions
concurrency:
  group: hostname-generator
  cancel-in-progress: false

jobs:
  generate-hostname:
    name: "Generate ${{ github.event.inputs.count }} ${{ github.event.inputs.os }} (${{ github.event.inputs.environment }}) hostname(s)"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Restore latest state file so counter continues from last run
      - uses: actions/cache@v4
        with:
          path: hostname_state.json
          key: hostname-state-${{ github.run_id }}
          restore-keys: hostname-state-

      - name: Validate count
        run: |
          COUNT="${{ github.event.inputs.count }}"
          if ! [[ "$COUNT" =~ ^[0-9]+$ ]] || [ "$COUNT" -lt 1 ] || [ "$COUNT" -gt 20 ]; then
            echo "Error: count must be between 1 and 20."
            exit 1
          fi

      - name: Generate hostnames
        id: hostname
        run: |
          OUTPUT=$(python hostname_generator.py \
            --environment "${{ github.event.inputs.environment }}" \
            --os          "${{ github.event.inputs.os }}" \
            --count       "${{ github.event.inputs.count }}")

          echo "$OUTPUT"

          # Write every key=value line from script output to GITHUB_OUTPUT
          while IFS= read -r line; do
            echo "$line" >> $GITHUB_OUTPUT
          done <<< "$OUTPUT"

      # Save updated state with unique key so next run can restore it
      - uses: actions/cache@v4
        with:
          path: hostname_state.json
          key: hostname-state-${{ github.run_id }}

      - name: Summary
        run: |
          echo "### Generated Hostnames" >> $GITHUB_STEP_SUMMARY
          echo "| # | Hostname | Environment | OS |" >> $GITHUB_STEP_SUMMARY
          echo "|---|----------|-------------|----|" >> $GITHUB_STEP_SUMMARY

          # Parse hostnames directly from state file to avoid dynamic output refs
          python - <<'EOF'
          import json, os
          with open("hostname_state.json") as f:
              state = json.load(f)
          count = int(os.environ["COUNT"])
          recent = state["used"][-count:]
          env    = os.environ["ENV"]
          os_type = os.environ["OS_TYPE"]
          summary = os.environ["GITHUB_STEP_SUMMARY"]
          with open(summary, "a") as f:
              for i, h in enumerate(recent, 1):
                  f.write(f"| {i} | `{h}` | {env} | {os_type} |\n")
          EOF
        env:
          COUNT:   ${{ github.event.inputs.count }}
          ENV:     ${{ github.event.inputs.environment }}
          OS_TYPE: ${{ github.event.inputs.os }}
